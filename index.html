<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MC 0.1.0 Web Port</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; image-rendering: pixelated; }
        #ui { position: absolute; top: 10px; left: 10px; color: lime; font-family: monospace; z-index: 10; font-size: 20px; }
    </style>
    
    <!-- JSZip Library -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
    <div id="ui">FPS: <span id="fpsDisplay">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <!-- Embedded Loader -->
    <script>
        const Loader = {
            assets: {},
            sounds: {},
            
            loadZip: async function() {
                try {
                    console.log("Fetching zip file...");
                    const response = await fetch("https://raw.githubusercontent.com/yassinnice/js-html-Minecraft-port-0.1.0/main/Minecraft%20Pocket%20Edition%20Demo%200.1.0%20uncrackted_2.zip");

                                                
                    
                    if (!response.ok) throw new Error("Failed to fetch zip");
                    
                    const zipData = await response.blob();
                    const zip = await JSZip.loadAsync(zipData);
                    
                    console.log("Zip loaded, extracting assets...");
                    
                    const iconFile = await zip.file("res/drawable/iconx.png").async("blob");
                    this.assets.icon = new Image();
                    this.assets.icon.src = URL.createObjectURL(iconFile);
                    
                    const clickFile = await zip.file("res/raw/click.ogg").async("blob");
                    this.sounds.click = new Audio(URL.createObjectURL(clickFile));
                    
                    console.log("Extraction complete!");
                } catch (err) {
                    console.error("Loader Error:", err);
                }
            }
        };
    </script>

    <!-- Game Engine -->
    <script src="running.js"></script>
</body>
</html>
